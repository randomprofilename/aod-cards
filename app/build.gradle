plugins {
    id 'com.android.application'
}

dependencies {
    // Provided by LSPosed only when this APK is enabled as a module.
    compileOnly 'io.github.libxposed:api:102.0.0'
}

android {
    namespace 'com.aodcards'
    compileSdk 37
    buildToolsVersion '37.0.0'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    defaultConfig {
        applicationId 'com.aodcards'
        minSdk 36
        targetSdk 37
        versionCode 5
        versionName 'v0.2.2'
        testInstrumentationRunner 'com.aodcards.RegressionInstrumentation'
    }
    buildTypes {
        release {
            proguardFiles 'proguard-rules.pro'
            optimization {
                enable = true
            }
        }
    }
}
